[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "config-tidy"
version = "0.1.0"
description = "Clean GitHub Actions workflow YAML: indent, deprecated actions, set-output, and a minimal permissions block. Rules and code, no AI."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Joshua Almeida" }]
requires-python = ">=3.10"
keywords = ["github-actions", "yaml", "cli", "offline", "no-ai", "workflows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/sponsors/fitzyracing1"
Repository = "https://github.com/fitzyracing1/config-tidy"

[project.scripts]
config-tidy = "config_tidy.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
